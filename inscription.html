<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Créer un compte — CréditNova</title>
<link rel="icon" type="image/svg+xml" href="images/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/demande.css">
<link rel="stylesheet" href="css/espace-client.css">
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="index.html" class="logo">
      <span class="logo-mark"><img src="images/favicon.svg" width="34" height="34" alt=""></span>
      <span class="logo-text">Crédit<span class="accent-text">Nova</span></span>
    </a>
    <div class="header-actions">
      <a href="index.html" class="btn btn-ghost">← Retour à l'accueil</a>
    </div>
  </div>
</header>

<section class="auth-section">
  <div class="container">
    <div class="auth-card">
      <div class="auth-icon">👤</div>
      <h1>Créer votre espace client</h1>
      <p class="auth-sub">Suivez vos demandes de prêt et retrouvez vos informations en un seul endroit.</p>

      <div class="auth-error" id="authError" hidden></div>
      <div class="auth-success" id="authSuccess" hidden></div>

      <form class="auth-form" id="signupForm" novalidate>
        <div class="form-grid">
          <div class="form-field">
            <label for="firstName">Prénom</label>
            <input type="text" id="firstName" name="firstName" placeholder="Jean" required>
          </div>
          <div class="form-field">
            <label for="lastName">Nom</label>
            <input type="text" id="lastName" name="lastName" placeholder="Dupont" required>
          </div>
        </div>
        <div class="form-field">
          <label for="email">Adresse e-mail</label>
          <input type="email" id="email" name="email" placeholder="jean.dupont@email.com" required>
        </div>
        <div class="form-field">
          <label for="password">Mot de passe</label>
          <input type="password" id="password" name="password" placeholder="8 caractères minimum" minlength="8" required>
        </div>
        <div class="form-field">
          <label for="passwordConfirm">Confirmer le mot de passe</label>
          <input type="password" id="passwordConfirm" name="passwordConfirm" placeholder="Retapez votre mot de passe" minlength="8" required>
        </div>

        <label class="checkbox-field">
          <input type="checkbox" id="consent" name="consent" required>
          <span>J'accepte les <a href="cgu.html">CGU</a> et la <a href="confidentialite.html">politique de confidentialité</a>.</span>
        </label>

        <button type="submit" class="btn btn-cta auth-submit">Créer mon compte</button>
      </form>

      <p class="auth-switch">Déjà un compte ? <a href="connexion.html">Se connecter</a></p>
    </div>
  </div>
</section>

<footer class="site-footer">
  <div class="container footer-bottom">
    <p>© 2026 CréditNova. Tous droits réservés.</p>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/auth.js"></script>
<script>
document.getElementById('signupForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorBox = document.getElementById('authError');
  errorBox.hidden = true;

  const form = e.target;
  if (!form.checkValidity()) { form.reportValidity(); return; }

  const password = document.getElementById('password').value;
  const passwordConfirm = document.getElementById('passwordConfirm').value;
  if (password !== passwordConfirm) {
    errorBox.textContent = 'Les deux mots de passe ne correspondent pas.';
    errorBox.hidden = false;
    return;
  }

  try {
    const data = await CreditNovaAuth.signup({
      firstName: document.getElementById('firstName').value.trim(),
      lastName: document.getElementById('lastName').value.trim(),
      email: document.getElementById('email').value.trim(),
      password
    });

    if (data.session) {
      // Confirmation e-mail désactivée côté Supabase : session active immédiatement.
      window.location.href = 'espace-client.html';
    } else {
      // Confirmation e-mail activée (réglage par défaut Supabase) : pas de session tant que non confirmé.
      form.hidden = true;
      errorBox.hidden = true;
      const successBox = document.getElementById('authSuccess');
      successBox.textContent = 'Compte créé ! Vérifiez votre boîte e-mail et cliquez sur le lien de confirmation avant de vous connecter.';
      successBox.hidden = false;
    }
  } catch (err) {
    errorBox.textContent = err.message;
    errorBox.hidden = false;
  }
});
</script>
</body>
</html>
