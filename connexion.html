<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion — CréditNova</title>
<link rel="icon" type="image/svg+xml" href="images/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/demande.css">
<link rel="stylesheet" href="css/espace-client.css">
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="index.html" class="logo">
      <span class="logo-mark"><img src="images/favicon.svg" width="34" height="34" alt=""></span>
      <span class="logo-text">Crédit<span class="accent-text">Nova</span></span>
    </a>
    <div class="header-actions">
      <a href="index.html" class="btn btn-ghost">← Retour à l'accueil</a>
    </div>
  </div>
</header>

<section class="auth-section">
  <div class="container">
    <div class="auth-card">
      <div class="auth-icon">🔐</div>
      <h1>Connexion à votre espace</h1>
      <p class="auth-sub">Accédez à vos informations et au suivi de vos demandes.</p>

      <div class="auth-error" id="authError" hidden></div>

      <form class="auth-form" id="loginForm" novalidate>
        <div class="form-field">
          <label for="email">Adresse e-mail</label>
          <input type="email" id="email" name="email" placeholder="jean.dupont@email.com" required>
        </div>
        <div class="form-field">
          <label for="password">Mot de passe</label>
          <input type="password" id="password" name="password" placeholder="Votre mot de passe" required>
        </div>

        <button type="submit" class="btn btn-cta auth-submit">Se connecter</button>
      </form>

      <p class="auth-switch">Pas encore de compte ? <a href="inscription.html">Créer un compte</a></p>
    </div>
  </div>
</section>

<footer class="site-footer">
  <div class="container footer-bottom">
    <p>© 2026 CréditNova. Tous droits réservés.</p>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/auth.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorBox = document.getElementById('authError');
  errorBox.hidden = true;

  const form = e.target;
  if (!form.checkValidity()) { form.reportValidity(); return; }

  try {
    await CreditNovaAuth.login({
      email: document.getElementById('email').value.trim(),
      password: document.getElementById('password').value
    });
    window.location.href = 'espace-client.html';
  } catch (err) {
    errorBox.textContent = err.message;
    errorBox.hidden = false;
  }
});
</script>
</body>
</html>
